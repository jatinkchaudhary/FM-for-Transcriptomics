<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text,#14181d);background:var(--bg,#fbfbfa);-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:var(--accent,#0f6f7a);text-decoration:none}
  a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c9d0d7;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  input[type=range]{accent-color:#0f6f7a}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:760px){
    body{overflow:auto}
    .app-shell{display:block!important;height:auto!important;min-height:100vh}
    .side-rail{width:100%!important;height:auto!important}
    .side-rail>div:nth-child(2){display:grid!important;grid-template-columns:1fr 1fr;gap:14px!important;overflow:visible!important}
    .main-shell{height:780px!important;min-height:780px}
    .top-nav{overflow-x:auto;padding:0 8px!important}
    .top-nav nav{min-width:max-content}
    .main-content{min-height:720px}
    .results-shell{grid-template-columns:1fr!important}
    .results-nav{display:flex!important;gap:4px;overflow-x:auto!important;border-right:none!important;border-bottom:1px solid #e3e6ea}
    .results-nav>div{display:none}
    .results-nav>button{min-width:176px!important}
    .results-body{min-height:620px}
    .downstream-shell{grid-template-columns:1fr!important;height:auto!important}
    .downstream-task-nav{display:flex!important;gap:4px;overflow-x:auto!important;border-right:none!important;border-bottom:1px solid #e3e6ea;padding:8px!important}
    .downstream-task-nav>div{display:none}
    .downstream-task-nav>button{display:inline-block!important;width:auto!important;min-width:max-content;margin:0!important;white-space:nowrap}
    .downstream-content{min-height:640px;padding:14px!important}
    .live-two-column{grid-template-columns:1fr!important}
    .atlas-viz-three,.atlas-viz-two{grid-template-columns:1fr!important}
    .plotly-3d-host{height:480px!important;min-height:480px!important}
  }
</style>

<div class="app-shell" style="display:flex;height:100vh;width:100vw;background:{{ bg }};color:{{ text }}">

  <!-- ================= LEFT RAIL ================= -->
  <aside class="side-rail" style="width:262px;flex:none;background:{{ panel }};border-right:1px solid {{ border }};display:flex;flex-direction:column;height:100%">
    <div style="padding:16px 16px 14px;border-bottom:1px solid {{ border }}">
      <div style="display:flex;align-items:center;gap:9px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="3" stroke="{{ accent }}" stroke-width="1.7"/><path d="M2 9h20M2 15h20M9 2v20M15 2v20" stroke="{{ accent }}" stroke-width="1.1" opacity=".55"/><rect x="9" y="9" width="6" height="6" fill="{{ accent }}"/></svg>
        <div>
          <div style="font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.22">ARCHS4 Imputation Studio</div>
          <div class="mono" style="font-size:9.5px;color:{{ faint }};letter-spacing:.06em;margin-top:4px">v2 · Txn_Jatin · dim 512</div>
        </div>
      </div>
    </div>

    <div style="flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px">
      <!-- data -->
      <div>
        <div class="mono" style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:{{ faint }};margin-bottom:8px">Data</div>
        <label style="display:block;border:1px dashed {{ border2 }};border-radius:7px;padding:12px;text-align:center;cursor:pointer;font-size:11.5px;color:{{ muted }};background:{{ bg }}" onDrop="{{ onDrop }}" onDragOver="{{ onDragOver }}">
          <input type="file" accept=".csv,.tsv,.txt" style="display:none" onChange="{{ onFile }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-bottom:4px"><path d="M12 15V4m0 0L8 8m4-4l4 4M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2" stroke="{{ muted }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div><span style="color:{{ accent }};font-weight:600">Upload</span> or drop matrix</div>
          <div class="mono" style="font-size:9px;color:{{ faint }};margin-top:3px">CSV · TSV · TXT · either orientation</div>
        </label>
        <button style="width:100%;margin-top:8px;padding:8px;border:1px solid {{ border2 }};background:{{ bg }};border-radius:6px;font-size:11.5px;font-weight:500;color:{{ text }};cursor:pointer;font-family:inherit" onClick="{{ loadSample }}">Load ARCHS4-style sample</button>
        <button style="width:100%;margin-top:6px;padding:8px;border:1px solid {{ border2 }};background:{{ bg }};border-radius:6px;font-size:11.5px;font-weight:500;color:{{ text }};cursor:pointer;font-family:inherit" onClick="{{ loadRandomPanel }}">Load random 50-gene TCGA test</button>
        <div class="mono" style="font-size:10px;color:{{ muted }};margin-top:9px;line-height:1.5">{{ dataLabel }}</div>
      </div>

      <!-- model -->
      <div>
        <div class="mono" style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:{{ faint }};margin-bottom:8px">Model</div>
        <select style="width:100%;padding:8px 9px;border:1px solid {{ border2 }};background:{{ panel }};border-radius:6px;font-size:12px;color:{{ text }};font-family:inherit;cursor:pointer" value="{{ model }}" onChange="{{ onModel }}">
          <sc-for list="{{ models }}" as="m" hint-placeholder-count="4">
            <option value="{{ m.id }}">{{ m.label }}</option>
          </sc-for>
        </select>
        <div class="mono" style="font-size:9.5px;color:{{ faint }};margin-top:6px;line-height:1.5">{{ modelNote }}</div>
      </div>

      <!-- normalization -->
      <div>
        <div class="mono" style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:{{ faint }};margin-bottom:8px">Normalization</div>
        <div style="display:flex;gap:4px;background:{{ bg }};border:1px solid {{ border }};border-radius:7px;padding:3px">
          <sc-for list="{{ norms }}" as="nrm" hint-placeholder-count="3">
            <button style="{{ nrm.style }}" onClick="{{ nrm.set }}">{{ nrm.label }}</button>
          </sc-for>
        </div>
      </div>

      <!-- clamp -->
      <div>
        <div class="mono" style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:{{ faint }};margin-bottom:8px;display:flex;justify-content:space-between"><span>Color clamp (pctile)</span><span style="color:{{ muted }}">{{ clampLabel }}</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="range" min="0" max="20" step="1" value="{{ clampLo }}" style="flex:1" onInput="{{ onClampLo }}">
          <input type="range" min="80" max="100" step="1" value="{{ clampHi }}" style="flex:1" onInput="{{ onClampHi }}">
        </div>
        <div style="height:12px;border-radius:3px;margin-top:8px;background:{{ colormapCss }}"></div>
      </div>

      <!-- search -->
      <div>
        <div class="mono" style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:{{ faint }};margin-bottom:8px">Find gene / sample</div>
        <input type="text" placeholder="TP53, EGFR, GSM…" value="{{ search }}" onInput="{{ onSearch }}" style="width:100%;padding:7px 9px;border:1px solid {{ border2 }};background:{{ panel }};border-radius:6px;font-size:11.5px;color:{{ text }};font-family:inherit" class="mono">
      </div>
    </div>

    <div style="padding:14px 16px;border-top:1px solid {{ border }}">
      <button style="width:100%;padding:11px;background:{{ runBg }};color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px" onClick="{{ runImpute }}" disabled="{{ running }}">
        <sc-if value="{{ running }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="animation:spin .8s linear infinite"><circle cx="12" cy="12" r="9" stroke="#ffffff55" stroke-width="3"/><path d="M12 3a9 9 0 019 9" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></sc-if>
        {{ runLabel }}
      </button>
      <div style="height:4px;background:{{ border }};border-radius:3px;margin-top:9px;overflow:hidden"><div style="height:100%;width:{{ progressPct }};background:{{ accent }};transition:width .15s"></div></div>
      <div class="mono" style="font-size:9.5px;color:{{ faint }};margin-top:6px;text-align:center">{{ jobStatus }}</div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main-shell" style="flex:1;display:flex;flex-direction:column;height:100%;min-width:0">
    <!-- header / tabs -->
    <header class="top-nav" style="flex:none;background:{{ panel }};border-bottom:1px solid {{ border }};display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:50px">
      <nav style="display:flex;gap:2px;height:100%">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
          <button style="{{ t.style }}" onClick="{{ t.set }}">{{ t.label }}</button>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="{{ apiChipStyle }}" class="mono">{{ apiChip }}</div>
        <button title="Toggle theme" style="width:32px;height:32px;border:1px solid {{ border2 }};background:{{ bg }};border-radius:6px;cursor:pointer;color:{{ muted }};display:flex;align-items:center;justify-content:center" onClick="{{ toggleTheme }}">
          <span style="font-size:14px">{{ themeIcon }}</span>
        </button>
      </div>
    </header>

    <!-- content -->
    <div class="main-content" style="flex:1;overflow:auto;min-height:0">{{ tabContent }}</div>
  </main>

  <!-- tooltip -->
  <sc-if value="{{ tip.on }}" hint-placeholder-val="{{ false }}">
    <div class="mono" style="position:fixed;left:{{ tip.x }};top:{{ tip.y }};transform:translate(12px,12px);background:#14181d;color:#fff;border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.5;pointer-events:none;z-index:50;box-shadow:0 6px 20px #0004;max-width:230px">
      <div style="font-weight:600;color:#fff">{{ tip.gene }} · {{ tip.sample }}</div>
      <div style="color:#9ec6c9">value {{ tip.val }} · {{ tip.kind }}</div>
      <div style="color:{{ tip.confColor }}">{{ tip.conf }}</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;downstreamView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Table&quot;,&quot;Bar charts&quot;,&quot;Knowledge graph&quot;],&quot;default&quot;:&quot;Knowledge graph&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Downstream visualization&quot;,&quot;label&quot;:&quot;Result view&quot;},&quot;enrichMetric&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;q-value (−log10)&quot;,&quot;Fold enrichment&quot;],&quot;default&quot;:&quot;Fold enrichment&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Downstream visualization&quot;,&quot;label&quot;:&quot;Enrichment bar metric&quot;},&quot;graphEdgeThreshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:0.98,&quot;step&quot;:0.02,&quot;default&quot;:0.8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Downstream visualization&quot;,&quot;label&quot;:&quot;Similarity edge cutoff (|cosine|)&quot;},&quot;highlightSignificant&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Downstream visualization&quot;,&quot;label&quot;:&quot;Emphasize significant (q&lt;FDR)&quot;}}">
const VIRIDIS=[[68,1,84],[65,68,135],[42,120,142],[34,168,132],[122,209,81],[253,231,37]];
const MAKO=[[11,4,5],[59,48,89],[57,93,156],[52,151,169],[95,201,191],[222,245,229]];
function lerp(a,b,t){return a+(b-a)*t;}
function ramp(stops,t){t=Math.max(0,Math.min(1,t));const x=t*(stops.length-1);const i=Math.floor(x);const f=x-i;const a=stops[i],b=stops[Math.min(i+1,stops.length-1)];return[Math.round(lerp(a[0],b[0],f)),Math.round(lerp(a[1],b[1],f)),Math.round(lerp(a[2],b[2],f))];}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lgamma(x){const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(x<0.5)return Math.log(Math.PI/Math.sin(Math.PI*x))-lgamma(1-x);x-=1;let a=c[0];const t=x+g+0.5;for(let i=1;i<g+2;i++)a+=c[i]/(x+i);return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);}
function lchoose(n,k){if(k<0||k>n)return -Infinity;return lgamma(n+1)-lgamma(k+1)-lgamma(n-k+1);}
// hypergeometric upper tail P(X>=k) : draw n from N with K successes
function hyperUpper(k,N,K,n){let p=0;const kmax=Math.min(K,n);for(let i=k;i<=kmax;i++){p+=Math.exp(lchoose(K,i)+lchoose(N-K,n-i)-lchoose(N,n));}return Math.min(1,Math.max(0,p));}
function bh(pvals){const idx=pvals.map((p,i)=>[p,i]).sort((a,b)=>a[0]-b[0]);const m=pvals.length;const q=new Array(m);let prev=1;for(let r=m-1;r>=0;r--){const [p,i]=idx[r];const val=Math.min(prev,p*m/(r+1));q[i]=val;prev=val;}return q;}
function fmtE(x){if(x===0)return "0";if(x>=0.001&&x<1000)return x.toPrecision(3);return x.toExponential(2).replace('e','e');}
function cosine(a,b){let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return na&&nb?d/(Math.sqrt(na)*Math.sqrt(nb)):0;}
function auroc(scores,labels){const pos=[],neg=[];for(let i=0;i<scores.length;i++){(labels[i]?pos:neg).push(scores[i]);}if(!pos.length||!neg.length)return 0.5;let c=0;for(const p of pos)for(const n of neg){if(p>n)c++;else if(p===n)c+=0.5;}return c/(pos.length*neg.length);}

class Component extends DCLogic{
  state={tab:'input',model:'Txn_Jatin',norm:'raw',clampLo:1,clampHi:99,search:'',theme:'light',
    running:false,progress:0,jobStatus:'Load a matrix to begin',hasImputed:false,
    pinned:null,selection:new Set(),tip:{on:false},downTask:'Cohort overview',fdr:0.05,minSize:5,
    dataLabel:'No matrix loaded',viewRows:null,rowStart:0,cmpSync:0,apiStatus:'idle',
    modelsMeta:null,registry:null,resultExperiment:'github_protocol',
    downstreamData:null,downstreamStatus:'idle',querySample:0,inspectorSample:0,
    atlasData:null,atlasStatus:'idle',atlasError:null,atlasVizSample:0,
    osdrData:null,osdrStatus:'idle',osdrError:null,osdrSearch:'',osdrPage:1,
    osdrSelected:null,osdrReport:null,osdrReportStatus:'idle',
    topK:8,mapMethod:'umap',mapDims:'2d',mapColor:'group'};
  genes=[];samples=[];sampleClass=[];geneModule={};vals=[];miss=[];missCount=0;

  componentDidMount(){
    const q=new URLSearchParams(location.search);
    if(q.get('tab')==='osdr')this.setState({tab:'osdr'});
    this.apiUrl=q.has('api')?(q.get('api')||null):(location.protocol==='http:'||location.protocol==='https:'?location.origin:null);
    this.loadSample();
    if(this.apiUrl)this.loadRemoteMetadata();
    window.addEventListener('resize',this._rz=()=>{this.draw();if(this.map3d&&window.Plotly)window.Plotly.Plots.resize(this.map3d);});
    [60,200,500,900].forEach(t=>setTimeout(()=>this.draw(),t));
  }
  componentDidUpdate(pp,ps){
    if(!ps)return;
    if(ps.tab!==this.state.tab||ps.norm!==this.state.norm||ps.clampLo!==this.state.clampLo||ps.clampHi!==this.state.clampHi||ps.hasImputed!==this.state.hasImputed||ps.theme!==this.state.theme||ps.rowStart!==this.state.rowStart||ps.viewRows!==this.state.viewRows||ps.selection!==this.state.selection){this.draw();}
    if(this.state.tab==='downstream'&&this.state.downTask==='Sample map'&&this.state.mapDims==='3d'&&
      (ps.tab!==this.state.tab||ps.downTask!==this.state.downTask||ps.mapDims!==this.state.mapDims||
       ps.mapMethod!==this.state.mapMethod||ps.mapColor!==this.state.mapColor||
       ps.querySample!==this.state.querySample||ps.theme!==this.state.theme||
       ps.downstreamData!==this.state.downstreamData)){
      requestAnimationFrame(()=>this.drawPlotly3d());
    }
  }

  async loadRemoteMetadata(){
    this.setState({apiStatus:'connecting'});
    try{
      const base=this.apiUrl.replace(/\/$/,'');
      const [healthResponse,modelsResponse,experimentsResponse]=await Promise.all([
        fetch(base+'/api/health'),fetch(base+'/api/models'),fetch(base+'/api/experiments')
      ]);
      if(!healthResponse.ok||!modelsResponse.ok||!experimentsResponse.ok)throw new Error('metadata endpoint unavailable');
      const health=await healthResponse.json(),models=await modelsResponse.json(),registry=await experimentsResponse.json();
      this.remoteHealth=health;
      this.setState({apiStatus:'live',modelsMeta:models.models,registry});
      this.loadOsdr(1,'');
    }catch(error){
      this.setState({apiStatus:'offline',jobStatus:'Remote API unavailable: '+error.message});
    }
  }

  async loadOsdr(page=this.state.osdrPage,search=this.state.osdrSearch){
    if(!this.apiUrl)return;
    this.setState({osdrStatus:'loading',osdrError:null});

    const genes=moduleGenes.concat(bg).slice(0,240);
    const classes=[['Tumor',13],['Adjacent-normal',12],['Cell-line',11],['Spaceflight',10]];
    const samples=[];const sampleClass=[];let gsm=4820100;
    classes.forEach(([cn,n])=>{for(let i=0;i<n;i++){samples.push('GSM'+(gsm++)+'_'+cn);sampleClass.push(cn);}});
    // module activity per class
    const act={
      'Tumor':{cell_cycle:2.4,p53:0.5,immune:0.7,pi3k_akt:1.9,apoptosis:0.6,oxphos:1.0,emt:1.8},
      'Adjacent-normal':{cell_cycle:0.6,p53:1.4,immune:1.2,pi3k_akt:0.9,apoptosis:1.3,oxphos:1.3,emt:0.7},
      'Cell-line':{cell_cycle:2.0,p53:0.7,immune:0.3,pi3k_akt:1.6,apoptosis:0.8,oxphos:1.5,emt:1.2},
      'Spaceflight':{cell_cycle:0.8,p53:1.1,immune:1.9,pi3k_akt:1.0,apoptosis:1.5,oxphos:0.6,emt:1.0},

  parseMatrix(text,name){

    const hit=arr=>arr.filter(x=>HGNC.has((x||'').toUpperCase())).length;

  }

  // ---------- imputation ----------
  runImpute(){
    if(this.state.running)return;
    const meta=this.currentModelMeta();
    if(meta&&!meta.imputation_supported){
      this.setState({running:false,progress:0,jobStatus:meta.label+' is embedding-only; expression imputation is NaN by protocol.',hasImputed:false});

    }
    this.setState({running:true,progress:0.05,jobStatus:this.apiUrl?('POST '+this.apiUrl.replace(/\/$/,'')+'/api/impute …'):'Running in-browser surrogate…'});
    if(this.apiUrl)this.imputeViaApi();else setTimeout(()=>this.runSurrogate(),120);
  }

    this.setState({running:false,progress:1,hasImputed:true,tab:'impute',jobStatus:(source==='api'?'Backend imputed ':'Surrogate imputed ')+ic+' values · mean conf '+(ic?(cs/ic).toFixed(2):'0'),downstreamData:null,downstreamStatus:'idle',atlasData:null,atlasStatus:'idle',atlasError:null,atlasVizSample:0,querySample:0,inspectorSample:0});
  }
  // POST the matrix to the FastAPI checkpoint; response { imputed:[[…]], confidence:[[…]] }
  async imputeViaApi(){
    const G=this.genes.length,S=this.samples.length;
    const matrix=this.vals.map((row,g)=>row.map((v,s)=>this.miss[g][s]?null:v));
    try{
      const res=await fetch(this.apiUrl.replace(/\/$/,'')+'/api/impute',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:this.state.model,genes:this.genes,samples:this.samples,matrix,missing:this.miss,input_scale:'auto'})});
      const data=await res.json();
      if(!res.ok)throw new Error(data.message||('HTTP '+res.status));
      const imp=this.vals.map(r=>r.slice());const mask=this.vals.map(r=>r.map(()=>0));const conf=this.vals.map(r=>r.map(()=>1));

        imp[g][s]=(data.imputed&&data.imputed[g]!=null&&data.imputed[g][s]!=null)?data.imputed[g][s]:this.vals[g][s];
        conf[g][s]=(data.confidence&&data.confidence[g]!=null&&data.confidence[g][s]!=null)?data.confidence[g][s]:0.5;}}

  async runAtlas(){

    const inputLabel=this.state.dataLabel;
    this.setState({atlasData:null,atlasStatus:'running',atlasError:null,atlasVizSample:0});
    const matrix=this.imp.map(row=>row.slice());
    const missing=this.imp.map(row=>row.map(()=>false));
    try{
      const res=await fetch(this.apiUrl.replace(/\/$/,'')+'/api/atlas',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({genes:this.genes,samples:this.samples,matrix,missing,input_scale:'auto'})});
      const data=await res.json();
      if(!res.ok)throw new Error(data.message||('HTTP '+res.status));
      if(requestId!==this._atlasRequestId)return;
      data.input_file=inputLabel;
      this.setState({atlasData:data,atlasStatus:'complete',atlasError:null,atlasVizSample:0});
    }catch(e){if(requestId===this._atlasRequestId)this.setState({atlasData:null,atlasStatus:'error',atlasError:e.message});}
  }

  // ---------- selection / enrichment ----------
  selectedGenes(){if(this.state.selection.size)return[...this.state.selection].map(g=>this.genes[g]);

    const G=this.genes.length,S=this.samples.length;const src=this.state.hasImputed?this.imp:this.vals;const va=[];for(let g=0;g<G;g++){let m=0;for(let s=0;s<S;s++)m+=Math.log1p(src[g][s]);m/=S;let v=0;for(let s=0;s<S;s++)v+=(Math.log1p(src[g][s])-m)**2;va.push([g,v]);}va.sort((a,b)=>b[1]-a[1]);return va.slice(0,60).map(x=>this.genes[x[0]]);}

  termDefs(db){
    const universe=new Set(this.genes.map(x=>x.toUpperCase()));

      ['cell cycle','GO:0007049','cell_cycle'],['DNA replication','GO:0006260',['MCM2','MCM3','MCM4','MCM5','MCM6','MCM7','PCNA','CDC6','CDT1','ORC1','RRM2B']],
      ['mitotic nuclear division','GO:0140014',['CCNB1','CDK1','CDC20','AURKA','AURKB','BUB1','BUB1B','PLK1','KIF11','CENPA','CENPE','TTK']],
      ['immune response','GO:0006955','immune'],['apoptotic process','GO:0006915','apoptosis'],
      ['epithelial to mesenchymal transition','GO:0001837','emt'],['oxidative phosphorylation','GO:0006119','oxphos'],
      ['p53 signal transduction','GO:0072331','p53'],
    ]:[
      ['Cell cycle','hsa04110','cell_cycle'],['PI3K-Akt signaling','hsa04151','pi3k_akt'],['Apoptosis','hsa04210','apoptosis'],
      ['p53 signaling pathway','hsa04115','p53'],['Oxidative phosphorylation','hsa00190','oxphos'],
      ['Cytokine-cytokine receptor','hsa04060','immune'],
    ];
    return TERMS.map(([name,id,key])=>({name,id,genes:(Array.isArray(key)?key:MODULES[key]).map(x=>x.toUpperCase()).filter(x=>universe.has(x))}));
  }
  enrichRows(db){
    const sel=new Set(this.selectedGenes().map(x=>x.toUpperCase()));
    const N=this.genes.length;const n=sel.size;
    const rows=this.termDefs(db).map(d=>{const K=d.genes.length;const hits=d.genes.filter(g=>sel.has(g));const k=hits.length;const fold=(k/n)/((K/N)||1);const p=hyperUpper(k,N,K,n);return{name:d.name,id:d.id,k,K,fold,p,hits};});

  geneEmb(g){const S=this.samples.length;const src=this.state.hasImputed?this.imp:this.vals;const e=[];for(let s=0;s<S;s++)e.push(Math.log1p(src[g][s]));return e;}

  hallmarkRows(){
    const rows=[];Object.keys(MODULES).forEach(key=>{const idxs=MODULES[key].map(x=>this.genes.indexOf(x)).filter(i=>i>=0);if(idxs.length<4)return;
      const embs=idxs.map(i=>this.geneEmb(i));

      const scores=[],labels=[];for(let a=0;a<embs.length;a++)for(let b=a+1;b<embs.length;b++){scores.push(cosine(embs[a],embs[b]));labels.push(1);}
      const G=this.genes.length;const rnd=mulberry32(key.length*7);for(let k=0;k<scores.length;k++){const gi=idxs[k%idxs.length];const gj=Math.floor(rnd()*G);scores.push(cosine(this.geneEmb(gi),this.geneEmb(gj)));labels.push(0);}
      rows.push({name:'HALLMARK_'+key.toUpperCase(),auroc:auroc(scores,labels),n:idxs.length});});
    return rows.sort((a,b)=>b.auroc-a.auroc);
  }

  interactionRows(){
    const pairsTR=[['TP53','CDKN1A'],['TP53','MDM2'],['TP53','BAX'],['STAT1','IRF1'],['STAT1','GBP1'],['E2F1','CCNE1'],['E2F1','MCM2'],['RELA','TNF'],['FOXO1','GADD45A'],['SNAI1','CDH1']];
    const rows=[];[['TRRUST','concat'],['SynLethDB','hadamard']].forEach(([db,feat])=>{
      const scores=[],labels=[];const G=this.genes.length;const rnd=mulberry32(db.length*3);
      pairsTR.forEach(([a,b])=>{const ia=this.genes.indexOf(a),ib=this.genes.indexOf(b);if(ia<0||ib<0)return;scores.push(Math.abs(cosine(this.geneEmb(ia),this.geneEmb(ib))));labels.push(1);

  sampleTaskRows(){
    // nearest-centroid classification of samples into their class
    const S=this.samples.length,G=this.genes.length;const src=this.state.hasImputed?this.imp:this.vals;
    const classes=[...new Set(this.sampleClass)].filter(c=>c!=='—');if(classes.length<2)return{acc:null,rows:[]};
    const cent={};classes.forEach(c=>cent[c]=new Array(G).fill(0));const cnt={};classes.forEach(c=>cnt[c]=0);

    classes.forEach(c=>{for(let g=0;g<G;g++)cent[c][g]/=cnt[c];});

  }

  sampleGroups(){
    const known=new Set(['Tumor','Adjacent-normal','Cell-line','Spaceflight']);
    return this.samples.map((sample,index)=>{
      const existing=this.sampleClass[index];
      if(known.has(existing))return existing;
      const parts=(''+sample).split(/[_|]/).filter(Boolean);
      const candidate=parts.length>1?parts[parts.length-1]:'Unlabeled';
      return candidate.length<=32&&candidate!==sample?candidate:'Unlabeled';
    });
  }

  async runDownstream(){
    if(!this.apiUrl){
      this.setState({downstreamStatus:'error: connect the H100 API to run live downstream analysis'});
      return;
    }
    const G=this.genes.length,S=this.samples.length;
    const source=this.state.hasImputed?this.imp:this.vals;
    const matrix=source.map((row,g)=>row.map((value,s)=>
      !this.state.hasImputed&&this.miss[g][s]?null:value));
    const missing=this.state.hasImputed
      ?this.miss.map(row=>row.map(()=>false))
      :this.miss.map(row=>row.map(Boolean));
    const inputScale=this._apiMeta&&this._apiMeta.input_scale
      ?this._apiMeta.input_scale
      :(this.state.norm==='raw'?'auto':'log1p');
    this.setState({downstreamStatus:'running',downstreamData:null});
    try{
      const response=await fetch(this.apiUrl.replace(/\/$/,'')+'/api/downstream',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:this.state.model,
          genes:this.genes,
          samples:this.samples,
          groups:this.sampleGroups(),
          matrix,
          missing,
          input_scale:inputScale
        })
      });
      const data=await response.json();
      if(!response.ok)throw new Error(data.message||('HTTP '+response.status));
      if(data.source!=='current_request')throw new Error('backend did not return request-scoped results');
      const preferred=data.projections&&data.projections.umap?'umap':'pca';
      this.setState({
        downstreamData:data,
        downstreamStatus:'ready',
        querySample:Math.min(this.state.querySample,S-1),
        inspectorSample:Math.min(this.state.inspectorSample,S-1),
        mapMethod:preferred
      });
    }catch(error){
      this.setState({downstreamStatus:'error: '+error.message,downstreamData:null});
    }
  }

          report.status==='complete'?h('div',{style:{whiteSpace:'pre-wrap',fontSize:'11px',lineHeight:1.6,marginTop:'10px'}},report.text):
          h('div',{style:{fontSize:'11px',color:report.status==='failed_validation'?'#c2740a':c.faint,marginTop:'12px'}},report.status==='failed_validation'?'The generated narrative failed grounding validation and is queued for retry.':'Report generation is pending. Numerical results are already available.'))),
      h('div',{style:{marginTop:'14px',padding:'10px 12px',border:'1px solid #e0a455',color:c.theme==='dark'?'#e0a455':'#9a3412',fontSize:'10.5px',lineHeight:1.5}},'Atlas similarities and species weights are evidence scores, not calibrated probabilities. Disease-set edges and language-head hypotheses are exploratory and must not be interpreted as diagnoses.'));
  }

  // ---------- theme colors ----------
  colors(){const dark=this.state.theme==='dark';return{theme:this.state.theme,
    bg:dark?'#0e1114':'#fbfbfa',panel:dark?'#171b20':'#ffffff',text:dark?'#e7ebef':'#14181d',muted:dark?'#9aa4b0':'#5b6673',faint:dark?'#6b7684':'#8a95a3',
    border:dark?'#252b32':'#e3e6ea',border2:dark?'#333b44':'#c9d0d7',accent:dark?'#39a9ae':'#0f6f7a',
    colormapCss:dark?'linear-gradient(90deg,#0b0405,#3b3059,#395d9c,#3497a9,#5fc9bf,#def5e5)':'linear-gradient(90deg,#440154,#414487,#2a788e,#22a884,#7ad151,#fde725)'};}

  renderVals(){
    const c=this.colors();
    const tabDef=[['input','Input'],['impute','Imputation'],['atlas','Gene Atlas'],['osdr','OSDR Cohort'],['results','Study Results'],['downstream','Downstream'],['about','About']];
    const tabStyle=id=>({padding:'0 16px',height:'100%',border:'none',borderBottom:'2px solid '+(this.state.tab===id?c.accent:'transparent'),background:'none',fontSize:'13px',fontWeight:this.state.tab===id?600:500,color:this.state.tab===id?c.text:c.muted,cursor:'pointer',fontFamily:'inherit'});
    const normDef=[['raw','raw'],['log1p','log1p'],['z','z-score','zscore']];
    const normStyle=v=>({flex:1,padding:'6px',border:'none',borderRadius:'5px',fontSize:'11px',cursor:'pointer',fontFamily:'inherit',background:this.state.norm===v?c.accent:'transparent',color:this.state.norm===v?'#fff':c.muted,fontWeight:this.state.norm===v?600:400});
    const content=this.state.tab==='input'?this.renderInput():this.state.tab==='impute'?this.renderImpute():this.state.tab==='atlas'?this.renderAtlas():this.state.tab==='osdr'?this.renderOsdr():this.state.tab==='results'?this.renderResults():this.state.tab==='downstream'?this.renderDownstream():this.renderAbout();
    const fallbackModels=[
      {id:'Txn_Jatin',label:'Txn_Jatin'},{id:'Txn_Jatin_OSDR_LoRA',label:'Txn_Jatin OSDR LoRA'},{id:'Txn_Jatin_contextual',label:'Txn_Jatin contextual'},
      {id:'BRIDGE',label:'BRIDGE'},...['37M','50M','93M','127M','147M'].map(size=>({id:'BulkFormer_'+size,label:'BulkFormer-'+size})),
      {id:'ESM2_PCA512_prior',label:'ESM2 PCA-512 prior'},{id:'ESM3',label:'ESM3'},{id:'Geneformer',label:'Geneformer'},{id:'scGPT',label:'scGPT'}
    ];
    const meta=this.currentModelMeta();
    return{
      bg:c.bg,text:c.text,panel:c.panel,border:c.border,border2:c.border2,accent:c.accent,muted:c.muted,faint:c.faint,colormapCss:c.colormapCss,
      tabs:tabDef.map(([id,label])=>({label,style:tabStyle(id),set:()=>this.setState({tab:id})})),
      models:this.state.modelsMeta||fallbackModels,
      model:this.state.model,onModel:e=>this.setState({model:e.target.value,hasImputed:false,downstreamData:null,downstreamStatus:'idle',atlasData:null,atlasStatus:'idle',atlasError:null,querySample:0,inspectorSample:0}),
      modelNote:meta?((meta.imputation_supported?'decoder':'embedding-only · imputation NaN')+' · '+meta.genes.toLocaleString()+' genes · dim '+meta.embedding_dim):'loading model metadata',
      norms:normDef.map(d=>({label:d[1],style:normStyle(d[2]||d[0]),set:()=>this.setState({norm:d[2]||d[0]})})),
      clampLo:this.state.clampLo,clampHi:this.state.clampHi,clampLabel:'p'+this.state.clampLo+'–p'+this.state.clampHi,
      onClampLo:e=>this.setState({clampLo:+e.target.value}),onClampHi:e=>this.setState({clampHi:+e.target.value}),
      search:this.state.search,onSearch:e=>this.setState({search:e.target.value}),
      onFile:this.onFile,onDrop:this.onDrop,onDragOver:this.onDragOver,loadSample:()=>this.loadSample(),loadRandomPanel:()=>this.loadRandomPanel(),
      dataLabel:this.state.dataLabel,
      runImpute:()=>this.runImpute(),running:this.state.running,runLabel:this.state.running?'Imputing…':(this.state.hasImputed?'Re-run imputation':'Run imputation'),
      runBg:this.state.running?c.faint:c.accent,progressPct:(this.state.progress*100).toFixed(0)+'%',jobStatus:this.state.jobStatus,
      apiChip:this.state.apiStatus==='live'?'● H100 live':this.state.apiStatus==='connecting'?'● connecting':this.apiUrl?'● API offline':'● surrogate mode',
      apiChipStyle:{fontSize:'10.5px',padding:'4px 10px',borderRadius:'20px',background:this.state.apiStatus==='live'?(c.theme==='dark'?'#12303040':'#f2f7f7'):(c.theme==='dark'?'#2a1f0e':'#fff7ed'),color:this.state.apiStatus==='live'?c.accent:'#c2740a',border:'1px solid '+(this.state.apiStatus==='live'?c.accent:'#e0a455')},
      themeIcon:this.state.theme==='dark'?'☀':'☾',toggleTheme:()=>this.setState({theme:this.state.theme==='dark'?'light':'dark'}),
      tabContent:content,tip:this.state.tip,
    };
  }
}
</script>
</body>
</html>
